<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — WABABE APPS</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">W</span><span>WABABE <b>APPS</b><small>ADMINISTRATOR</small></span></a><nav><a href="/">View public site</a><button class="btn btn-outline" id="logout">Sign out</button></nav></header><main class="section"><span class="eyebrow">ARCHIVE MANAGEMENT</span><h2>Application dashboard</h2><p>Publish and manage applications in the public archive.</p><section class="modal" style="width:100%;max-width:700px;margin:25px 0"><h2>Add an application</h2><form id="appForm"><label>Application name<input name="name" required maxlength="80"></label><label>Short description<textarea name="description" required maxlength="500" rows="3" style="padding:12px;border:1px solid #e6e9f1;border-radius:8px;font:14px Arial"></textarea></label><label>Category<select name="category"><option>Education</option><option>Islamic</option><option>Productivity</option><option>Tools</option><option>Other</option></select></label><label>Version<input name="version" placeholder="1.0.0" required></label><label>App icon (optional)<input name="icon" type="file" accept="image/png,image/jpeg,image/webp"></label><label>APK file<input name="file" type="file" accept=".apk,application/vnd.android.package-archive" required></label><button class="btn btn-primary" type="submit">Publish application</button><p id="message" class="form-message"></p></form></section><h2>Published applications</h2><div id="adminApps" class="app-grid"></div></main><script src="/admin.js" defer></script></body></html>
